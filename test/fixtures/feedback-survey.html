<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ETLab - Student Feedback</title></head>
<body>
  <h3>Student Feedback on Curriculum</h3>
  <form action="/student/feedback/save" method="post">
    <fieldset class="form-group">
      <legend>1. The syllabus was covered on time</legend>
      <label><input type="radio" name="f1" value="a"> Strongly Agree</label>
      <label><input type="radio" name="f1" value="b"> Agree</label>
      <label><input type="radio" name="f1" value="c"> Neutral</label>
      <label><input type="radio" name="f1" value="d"> Disagree</label>
    </fieldset>

    <fieldset class="form-group">
      <legend>2. Number of days you were absent</legend>
      <label><input type="radio" name="f2" value="a"> 0 - 3 days</label>
      <label><input type="radio" name="f2" value="b"> 4 - 8 days</label>
      <label><input type="radio" name="f2" value="c"> 9 - 15 days</label>
    </fieldset>

    <div class="form-group">
      <label for="lab">3. Rate the laboratory facilities</label>
      <select id="lab" name="lab" class="form-control">
        <option value="">-- Select --</option>
        <option value="4">Excellent</option>
        <option value="3">Good</option>
        <option value="2">Average</option>
        <option value="1">Poor</option>
      </select>
    </div>

    <div class="form-group">
      <label for="remarks">4. Your remarks</label>
      <textarea id="remarks" name="remarks" class="form-control" required></textarea>
    </div>

    <div class="form-group">
      <label><input type="checkbox" name="declare" required> I confirm the above information is true</label>
    </div>

    <input type="submit" class="btn btn-success" value="Save">
  </form>
</body>
</html>
